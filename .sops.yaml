# Encryption rules for SOPS. Public keys only.
# working:     private key on the VM at ~/.config/sops/age/keys.txt,
#              installed into flux-system for Flux to decrypt with
# break-glass: private key stored outside the VM, never in the cluster
creation_rules:
  - path_regex: \.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
