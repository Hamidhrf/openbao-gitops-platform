apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: openbao
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/openbao-config
  prune: true
  wait: true
