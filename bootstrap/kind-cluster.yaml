# Local kind cluster: 1 control-plane node and 3 workers.
# Create with:
#   kind create cluster --config bootstrap/kind-cluster.yaml --kubeconfig ~/.kube/openbao-local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: openbao-local
networking:
  # No overlap with the existing kubeadm cluster on the same VM
  # (pods 10.244.0.0/16, services 10.96.0.0/12).
  podSubnet: 10.200.0.0/16
  serviceSubnet: 10.210.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
