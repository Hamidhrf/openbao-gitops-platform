# Point-in-time restore, reproducing the one tested on 23 September 2026.
#
# This example reads the original openbao-db catalogue generation on purpose. That
# generation is frozen and is not the current writer. serverName and targetTime
# belong together: do not replace only one of them. The current writer generation
# begins after this target and cannot reach it.
#
# For a different point in time, choose the generation that covers it and set
# targetTime to match. See docs/backup-restore.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openbao-db-pitr
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0fae0cb527912426a889ec0b21b9733e5b76fdc6ad8909914a6e8a6c8ba4f64b
  storage:
    size: 5Gi
  bootstrap:
    recovery:
      source: openbao-db
      recoveryTarget:
        targetTime: "2026-09-23T13:20:27.504913Z"
  externalClusters:
    - name: openbao-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: openbao-db
