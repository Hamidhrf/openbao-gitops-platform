# One-off base backup taken immediately after the disaster recovery
# rehearsal. The recovered cluster archives into a new catalogue
# generation, which holds WAL but no base backup until one is taken,
# so until this completes there is nothing to replay that WAL onto.
# Removed from the reconciled path once it has completed.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: openbao-db-after-recovery
  namespace: database
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: openbao-db
