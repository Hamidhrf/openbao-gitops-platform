apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: openbao-db-daily
  namespace: database
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: openbao-db
