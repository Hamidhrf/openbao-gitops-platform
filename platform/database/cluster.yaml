apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openbao-db
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0fae0cb527912426a889ec0b21b9733e5b76fdc6ad8909914a6e8a6c8ba4f64b
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  certificates:
    serverTLSSecret: openbao-db-server-tls
    serverCASecret: openbao-db-server-tls
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
  bootstrap:
    # Temporary: recover from the backup store after the loss of the
    # cluster. Returns to initdb once the recovery is verified.
    recovery:
      source: openbao-db
      database: openbao
      owner: openbao
      secret:
        name: openbao-db-credential
      # The target time selects the base backup and the stopping point.
      # It lies after the last write to the lost cluster and before any
      # later backup, so recovery replays the whole of timeline 3.
      recoveryTarget:
        targetTime: "2026-09-25 12:20:00+00"
  externalClusters:
    - name: openbao-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: openbao-db
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
        # A recovered cluster must not archive into the catalogue it
        # recovered from: CloudNativePG refuses to write into a non-empty
        # archive and stays in Setting up primary. Each recovery therefore
        # starts a new catalogue generation, named for the day it began.
        serverName: openbao-db-dr-20260925b
