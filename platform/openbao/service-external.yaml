# External access to the active OpenBao server (ADR-011).
# Reached through the kind host port mapping on the control-plane node.
# OpenBao terminates TLS itself; nothing here terminates or re-encrypts it.
apiVersion: v1
kind: Service
metadata:
  name: openbao-external
  namespace: openbao
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/name: openbao
    component: server
    openbao-active: "true"
  ports:
    - name: https
      port: 8200
      targetPort: 8200
      nodePort: 30820
      protocol: TCP
