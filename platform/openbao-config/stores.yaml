apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-pull
spec:
  conditions:
    - namespaces:
        - demo
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-pull
          serviceAccountRef:
            name: eso-pull
            audiences:
              - openbao
---
